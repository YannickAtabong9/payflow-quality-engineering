name: PayFlow Quality Gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: payflow
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U payflow -d payflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize database
        run: npm run db:init

      - name: Build TypeScript
        run: npm run build

      - name: Start PayFlow API
        run: |
          npm run dev > payflow-api.log 2>&1 &
          echo $! > payflow-api.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              echo "PayFlow API is ready"
              exit 0
            fi
            sleep 1
          done

          echo "PayFlow API failed to start"
          cat payflow-api.log
          exit 1

      - name: Run automated test suite
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: payflow-api-logs
          path: payflow-api.log
          if-no-files-found: ignore
